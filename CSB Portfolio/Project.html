<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaitanya Sai Botta-Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-color: #111;
        }

        body {
            background-color: #000000;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        nav {
            position: fixed;
            top: 50%;
            left: 11%;
            transform: translateY(-50%);
            z-index: 100;
        }

        nav ul {
            list-style: none;
            text-align: left;
            position: relative;
        }

        nav ul::after {
            content: '';
            position: absolute;
            left: -20px;
            top: -100px;
            width: 1px;
            height: calc(100% + 200px);
            background: linear-gradient(to bottom, transparent, #FFA6FF, transparent);
            opacity: 0.1;
            filter: blur(2px);
        }

        nav ul li {
            margin: 2rem 0;
            position: relative;
        }

        nav ul li a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        nav ul li a:hover {
            color: #FFA6FF;
        }

        nav ul li a.active {
            background: linear-gradient(90deg, #FFA6FF, #FF70FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        nav ul li a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #FFA6FF, #FF70FF);
        }

        nav ul li:nth-child(2) a {
            position: relative;
            left: 10px;
            
        }
        nav ul li:nth-child(3) a {
            position: relative;
            left: 10px;
            
        }

        .visual {
            position: fixed;
            top: 50%;
            left: -20%;
            transform: translateY(-50%);
            z-index: 0;
            opacity: 0;
        }

        .circle {
            width: clamp(300px, 45vw, 450px);
            height: clamp(300px, 45vw, 450px);
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 182, 193, 8), rgba(128, 0, 128, 8));
            position: relative;
            filter: blur(1px);
        }

        .orbit {
            position: absolute;
            width: clamp(350px, 55vw, 780px);
            height: clamp(350px, 55vw, 780px);
            border: 1px solid rgba(255, 255, 255, 0.396);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid white;
            border-radius: 55%;
            clip-path: polygon(0 0, 10% 0, 50% 50%, 0 50%);
            animation: moveInOrbit 8s linear infinite;
            opacity: 0.8;
        }

        .small-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(128, 0, 128, 0.8));
            filter: blur(1px);
            opacity: 0.8;
            z-index: 2;
        }

        .small-circle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: -80px;
            right: -30px;
            animation: floatAnimation 3s ease-in-out infinite;
        }

        .small-circle:nth-child(4) {
            width: 45px;
            height: 45px;
            bottom: -60px;
            right: -40px;
            animation: floatAnimation 4s ease-in-out infinite 1s;
        }

        @keyframes floatAnimation {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }
        
        @keyframes moveInOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            margin-left: 25%;
            padding: 4rem;
        }

        .filter-tabs {
            display: flex;
            gap: 2rem;
            margin-bottom: 4rem;
            padding-left: 1rem;
        }

        .filter-tab {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0.5rem 1rem;
            position: relative;
        }

        .filter-tab.active {
            color: white;
        }

        .filter-tab.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, rgba(255, 182, 193, 0.8), rgba(128, 0, 128, 0.8));
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
        }

        .project-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .project-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .project-image:hover::before {
            opacity: 1;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .project-image:hover img {
            filter: blur(1px);
            transform: scale(1.05);
        }

        .eye-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            z-index: 2;
            transition: all 0.3s ease;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .project-image:hover .eye-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .project-category {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        @media (max-width: 1280px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 1024px) {
            .container {
                margin-left: 0;
            }

            nav {
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.9);
                padding: 1rem;
            }

            nav ul {
                display: flex;
                justify-content: space-around;
            }

            nav ul::before,
            nav ul::after {
                display: none;
            }

            .visual {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }

            .filter-tabs {
                overflow-x: auto;
                padding-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work Experience</a></li>
            <li><a href="Project.html" class="active">Projects</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>

    <div class="visual">
        <div class="orbit"></div>
        <div class="circle"></div>
        <div class="small-circle"></div>
        <div class="small-circle"></div>
    </div>

    <div class="container">
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="Information Design">Information Design</button>
            <button class="filter-tab" data-filter="applications">Applications</button>
            <button class="filter-tab" data-filter="web">Web development</button>
        </div>

        <div class="projects-grid"></div>
    </div>

    <script>
        const projects = [
            {
                name: "Finance Dashboard",
                category: "web",
                image: "./assets/img1.jpeg",
                description: "Web development",
                link: "#finance"
            },
            {
                name: "Orizon",
                category: "web",
                image: "./assets/img2.jpeg",
                description: "Web development",
                link: "#orizon"
            },
            {
                name: "Fundo",
                category: "Information Design",
                image: "./assets/img3.jpeg",
                description: "Information Design",
                link: "#fundo"
            },
            {
                name: "Brawlhalla",
                category: "applications",
                image: "./assets/img4.jpeg",
                description: "Applications",
                link: "#brawlhalla"
            },
            {
                name: "DSM",
                category: "Information Design",
                image: "./assets/img5.jpeg",
                description: "Information Design",
                link: "https://www.youtube.com/watch?v=dgcYOm8n8ME"
            },
            {
                name: "DSM",
                category: "Information Design",
                image: "./assets/img5.jpeg",
                description: "Information Design",
                link: "#dsm"
            },
            {
                name: "MetaSpark",
                category: "Information Design",
                image: "./assets/img6.jpeg",
                description: "Information Design",
                link: "#metaspark"
            }
        ];

        function createProjectCard(project) {
            return `
                <div class="project-card" data-category="${project.category}">
                    <div class="project-image" onclick="window.location.href='${project.link}'">
                        <img src="${project.image}" alt="${project.name}">
                        <div class="eye-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                    </div>
                    <div class="project-info">
                        <h3>${project.name}</h3>
                        <div class="project-category">${project.description}</div>
                    </div>
                </div>
            `;
        }

        function filterProjects(category) {
            const projectCards = document.querySelectorAll('.project-card');
            
            projectCards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    gsap.to(card, {
                        opacity: 1,
                        y: 0,
                        duration: 0.5,
                        display: 'block'
                    });
                } else {
                    gsap.to(card, {
                        opacity: 0,
                        y: 30,
                        duration: 0.5,
                        onComplete: () => {
                            card.style.display = 'none';
                        }
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Populate projects
            const projectsGrid = document.querySelector('.projects-grid');
            projectsGrid.innerHTML = projects.map(createProjectCard).join('');

            // Initialize animations
            gsap.to('.visual', {
                opacity: 1,
                x: 0,
                duration: 1.5,
                ease: 'power3.out'
            });

            gsap.to('.project-card', {
                opacity: 1,
                y: 0,
                duration: 0.8,
                stagger: 0.2,
                ease: 'power2.out'
            });

            // Add filter functionality
            const filterTabs = document.querySelectorAll('.filter-tab');
            filterTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    filterTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    filterProjects(tab.dataset.filter);
                });
            });
        });

        //particle animation
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 80,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#FFA6FF'  // Brighter pink color
                },
                shape: {
                    type: 'circle'
                },
                opacity: {
                    value: 0.2,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 1,
                        opacity_min: 0.2,
                        sync: false
                    }
                },
                size: {
                    value: 2,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 3,
                        size_min: 0.2,
                        sync: false
                    }
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#FFA6FF',
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 3,
                    direction: 'none',
                    random: true,
                    straight: false,
                    out_mode: 'out',
                    bounce: false
                }
            },
            interactivity: {
                detect_on: 'window',
                events: {
                    onhover: {
                        enable: true,
                        mode: 'grab'
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 180,
                        line_linked: {
                            opacity: 0.5
                        }
                    }
                }
            },
            retina_detect: true
        });

        // Function to handle animations
        function animateContent() {
            // Animate the visual elements first
            gsap.to('.visual', {
                opacity: 1,
                x: 0,
                duration: 1.5,
                ease: 'power3.out'
            });

            // Animate each project card with a longer stagger and more pronounced effect
            gsap.to('.project-card', {
                opacity: 1,
                y: 0,
                duration: 1.2,
                stagger: 0.8,
                ease: 'power2.out',
                delay: 0.5
            });
        }

        // Initialize animations when page loads
        document.addEventListener('DOMContentLoaded', () => {
            animateContent();
        });
    </script>
</body>
</html>
