    <div class="visual">

        <!-- <div class="small-circle"></div> -->

    <div class="container">
        <div class="contact-section">
            <div class="contact-header">
                <h1>Get in Touch</h1>
                <p>Have a project in mind? Let's create something amazing together. Fill out the form below and I'll get back to you as soon as possible.</p>
            </div>

            <form id="contactForm" class="contact-form">
                <!-- Remove the onclick from button and fix field names -->
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="from_name" class="form-input" placeholder="Your name" required>
                </div>
            
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email_id" class="form-input" placeholder="Your email" required>
                </div>
            
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-input" placeholder="Tell me about your project" required></textarea>
                </div>
            
                <button type="submit" class="submit-btn">
                    Send Message
                    <div class="loading-spinner"></div>
                </button>
            </form>

            <div class="contact-info">
                <div class="info-item">
                    <h3>Email</h3>
                    <p>your.email@example.com (Update this)</p>
                </div>
                <div class="info-item">
                    <h3>Phone</h3>
                    <p>Your Phone Number (Update this)</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>


<script>
    emailjs.init("FpQuFJh8sVf7uB02S"); // Make sure this is your actual public key

document.addEventListener('DOMContentLoaded', () => {
    // Initialize animations
    gsap.to('.visual', {
                opacity: 1,
                x: 0,
                duration: 1.5,
                ease: 'power3.out'
            });

            gsap.to('.contact-section', {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: 'power2.out'
            });

            // Animate contact info
            gsap.from('.info-item', {
                opacity: 0,
                y: 30,
                duration: 0.8,
                stagger: 0.2,
                ease: 'power2.out',
                delay: 1
            });
    const form = document.getElementById('contactForm');
    const submitBtn = form.querySelector('.submit-btn');
    const toast = document.getElementById('toast');

    function showToast(message, type) {
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Add loading state
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        // Prepare template parameters
        const templateParams = {
            to_name: "Admin", // Add a default recipient name
            from_name: form.elements['from_name'].value,
            email_id: form.elements['email_id'].value,
            message: form.elements['message'].value
        };

        // Send email using EmailJS
        emailjs.send('service_awxzcll', 'template_ctk50q1', templateParams)
            .then(() => {
                showToast('Message sent successfully!', 'success');
                form.reset();
            })
            .catch((error) => {
                console.error('Error:', error);
                showToast('Failed to send message. Please try again.', 'error');
            })
            .finally(() => {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            });
    });

   
});
</script>
