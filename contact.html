    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-color: #111;
        }

        body {
            background-color: #000000;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        nav {
            position: fixed;
            top: 50%;
            left: 11%;
            transform: translateY(-50%);
            z-index: 100;
        }

        /* nav::after {
            content: '';
            position: absolute;
            top: -20px;
            left: calc(100% + 20px);
            width: 1px;
            height: calc(100% + 40px);
            background: rgba(255, 255, 255, 0.1);
        } */
         
        nav ul::after {
            content: '';
            position: absolute;
            left: -20px;
            top: -100px;
            width: 1px;
            height: calc(100% + 200px);
            background: linear-gradient(to bottom, transparent, #FFA6FF, transparent);
            opacity: 0.1;
            filter: blur(2px);
        }

        nav ul {
            list-style: none;
            text-align: left;
            position: relative;
        }

        nav ul li {
            margin: 2rem 0;
            position: relative;
        }

        nav ul li a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #FFA6FF;
        }

        nav ul li a.active {
            background: linear-gradient(90deg, #FFA6FF, #FF70FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        nav ul li a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #FFA6FF, #FF70FF);
        }

        nav ul li:nth-child(2) a {
            position: relative;
            left: 10px;
            
        }
        nav ul li:nth-child(3) a {
            position: relative;
            left: 10px;
            
        }


        .visual {
            position: fixed;
            top: 50%;
            left: -20%;
            transform: translateY(-50%);
            z-index: 0;
            opacity: 0;
        }

        .circle {
            width: clamp(300px, 45vw, 450px);
            height: clamp(300px, 45vw, 450px);
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 182, 193, 8), rgba(128, 0, 128, 8));
            position: relative;
            filter: blur(1px);
        }

        .orbit {
            position: absolute;
            width: clamp(350px, 55vw, 780px);
            height: clamp(350px, 55vw, 780px);
            border: 1px solid rgba(255, 255, 255, 0.396);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid white;
            border-radius: 50%;
            clip-path: polygon(0 0, 10% 0, 50% 50%, 0 50%);
            animation: moveInOrbit 8s linear infinite;
            opacity: 0.8;
        }

        .small-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(128, 0, 128, 0.8));
            filter: blur(1px);
            opacity: 0.8;
            z-index: 2;
        }

        .small-circle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: -80px;
            right: -30px;
            animation: floatAnimation 3s ease-in-out infinite;
        }

        .small-circle:nth-child(4) {
            width: 45px;
            height: 45px;
            bottom: -60px;
            right: -40px;
            animation: floatAnimation 4s ease-in-out infinite 1s;
        }

        /* .small-circle:nth-child(5) {
            width: 35px;
            height: 35px;
            top: 40%;
            right: -80px;
            animation: floatAnimation 3.5s ease-in-out infinite 0.5s;
        } */

        @keyframes floatAnimation {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        @keyframes moveInOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            margin-left: 25%;
            padding: 4rem;
            position: relative;
            z-index: 1;
        }

        .contact-section {
            max-width: 800px;
            opacity: 0;
            transform: translateY(30px);
        }

        .contact-header {
            margin-bottom: 3rem;
        }

        .contact-header h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, rgba(255, 182, 193, 1), rgba(128, 0, 128, 1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            line-height: 1.6;
            max-width: 600px;
        }

        .contact-form {
            display: grid;
            gap: 2rem;
            max-width: 600px;
            margin-bottom: 4rem;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 800px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .info-item h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #fff;
            background: linear-gradient(135deg, rgba(255, 182, 193, 1), rgba(128, 0, 128, 1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-item p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            line-height: 1.4;
        }

        @media (max-width: 1024px) {
            .contact-info {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .contact-info {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .info-item {
                padding: 1.5rem;
            }
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(255, 182, 193, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea.form-input {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.8), rgba(128, 0, 128, 0.8));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .submit-btn.loading .loading-spinner {
            display: block;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            color: white;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.success {
            background: rgba(46, 213, 115, 0.9);
        }

        .toast.error {
            background: rgba(255, 71, 87, 0.9);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 1024px) {
            .container {
                margin-left: 0;
                padding: 2rem;
            }

            nav {
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.9);
                padding: 1rem;
            }

            nav ul {
                display: flex;
                justify-content: space-around;
            }

            .visual {
                display: none;
            }

            .contact-header h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .contact-header h1 {
                font-size: 2.5rem;
            }

            .contact-header p {
                font-size: 1rem;
            }

            .form-input {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="contact-section">
            <div class="contact-header">
                <h1>Get in Touch</h1>
                <p>Have a project in mind? Let's create something amazing together. Fill out the form below and I'll get back to you as soon as possible.</p>
            </div>

            <form id="contactForm" class="contact-form">
                <!-- Remove the onclick from button and fix field names -->
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="from_name" class="form-input" placeholder="Your name" required>
                </div>
            
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email_id" class="form-input" placeholder="Your email" required>
                </div>
            
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-input" placeholder="Tell me about your project" required></textarea>
                </div>
            
                <button type="submit" class="submit-btn">
                    Send Message
                    <div class="loading-spinner"></div>
                </button>
            </form>

            <div class="contact-info">
                <div class="info-item">
                    <h3>Email</h3>
                    <p>contact@example.com</p>
                </div>
                <div class="info-item">
                    <h3>Phone</h3>
                    <p>+1 (123) 456-7890</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>


<script>
    emailjs.init("FpQuFJh8sVf7uB02S"); // Make sure this is your actual public key

document.addEventListener('DOMContentLoaded', () => {
    // Initialize animations
    gsap.to('.visual', {
                opacity: 1,
                x: 0,
                duration: 1.5,
                ease: 'power3.out'
            });

            gsap.to('.contact-section', {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: 'power2.out'
            });

            // Animate contact info
            gsap.from('.info-item', {
                opacity: 0,
                y: 30,
                duration: 0.8,
                stagger: 0.2,
                ease: 'power2.out',
                delay: 1
            });
    const form = document.getElementById('contactForm');
    const submitBtn = form.querySelector('.submit-btn');
    const toast = document.getElementById('toast');

    function showToast(message, type) {
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Add loading state
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        // Prepare template parameters
        const templateParams = {
            to_name: "Admin", // Add a default recipient name
            from_name: form.elements['from_name'].value,
            email_id: form.elements['email_id'].value,
            message: form.elements['message'].value
        };

        // Send email using EmailJS
        emailjs.send('service_awxzcll', 'template_ctk50q1', templateParams)
            .then(() => {
                showToast('Message sent successfully!', 'success');
                form.reset();
            })
            .catch((error) => {
                console.error('Error:', error);
                showToast('Failed to send message. Please try again.', 'error');
            })
            .finally(() => {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            });
    });

   
});
</script>

});
